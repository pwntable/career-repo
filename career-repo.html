        function AdminView({ companies, setCompanies, showToast }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [editingCompany, setEditingCompany] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            const filtered = companies.filter(c => 
                c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                c.category.toLowerCase().includes(searchTerm.toLowerCase())
            );

            const handleDelete = (id, name) => {
                if (window.confirm(`Are you sure you want to remove ${name} from the portal?`)) {
                    setCompanies(prev => prev.filter(c => c.id !== id));
                    showToast(`Deleted ${name}`);
                }
            };

            const toggleVerified = (id) => {
                setCompanies(prev => prev.map(c => {
                    if (c.id === id) {
                        const updated = !c.is_verified;
                        showToast(`${c.name} verified status: ${updated}`);
                        return { ...c, is_verified: updated };
                    }
                    return c;
                }));
            };

            const toggleFeatured = (id) => {
                setCompanies(prev => prev.map(c => {
                    if (c.id === id) {
                        const updated = !c.is_featured;
                        showToast(`${c.name} featured status: ${updated}`);
                        return { ...c, is_featured: updated };
                    }
                    return c;
                }));
            };

            const handleSaveCompany = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const companyData = {
                    id: editingCompany ? editingCompany.id : String(Date.now()),
                    name: formData.get('name'),
                    slug: formData.get('name').toLowerCase().replace(/\s+/g, '-'),
                    category: formData.get('category'),
                    industry: formData.get('industry'),
                    company_type: formData.get('company_type'),
                    country: "Malaysia",
                    location: formData.get('location'),
                    career_url: formData.get('career_url'),
                    internship_url: formData.get('internship_url') || null,
                    graduate_url: formData.get('graduate_url') || null,
                    description: formData.get('description'),
                    is_verified: formData.get('is_verified') === 'on',
                    is_featured: formData.get('is_featured') === 'on',
                    initials: formData.get('name').substring(0, 2).toUpperCase(),
                    logo_bg: '#1e3a8a',
                    updated_at: new Date().toISOString().split('T')[0]
                };

                if (editingCompany) {
                    setCompanies(prev => prev.map(c => c.id === editingCompany.id ? companyData : c));
                    showToast(`Updated ${companyData.name}`);
                } else {
                    setCompanies(prev => [companyData, ...prev]);
                    showToast(`Added ${companyData.name}`);
                }

                setEditingCompany(null);
                setIsAdding(false);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-6">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900 dark:text-white">Admin Portal Dashboard</h1>
                            <p className="text-xs text-slate-500">Manage company database, verify external career portals, and feature listings.</p>
                        </div>

                        <button 
                            onClick={() => { setIsAdding(true); setEditingCompany(null); }}
                            className="px-4 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-semibold hover:bg-brand-700 transition"
                        >
                            + Add New Company
                        </button>
                    </div>

                    {/* Quick Stats Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div className="text-xs text-slate-500 font-medium">Total Listed</div>
                            <div className="text-2xl font-extrabold text-slate-900 dark:text-white">{companies.length}</div>
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div className="text-xs text-slate-500 font-medium">Verified Portals</div>
                            <div className="text-2xl font-extrabold text-emerald-600">{companies.filter(c => c.is_verified).length}</div>
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div className="text-xs text-slate-500 font-medium">With Internships</div>
                            <div className="text-2xl font-extrabold text-brand-600">{companies.filter(c => c.internship_url).length}</div>
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div className="text-xs text-slate-500 font-medium">Featured Companies</div>
                            <div className="text-2xl font-extrabold text-purple-600">{companies.filter(c => c.is_featured).length}</div>

                    </div>

                                    <th className="p-3">Verified</th>
                                    <th className="p-3">Featured</th>
                                    <th className="p-3 text-right">Actions</th>

                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                {filtered.map(c => (
                                    <tr key={c.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
                                        <td className="p-3 font-semibold text-slate-900 dark:text-white">
                                            <div>{c.name}</div>
                                            <div className="text-[10px] font-normal text-slate-400">{c.location}</div>
                                        </td>
                                        <td className="p-3 text-slate-600 dark:text-slate-300">{c.category}</td>
                                        <td className="p-3">
                                            {c.internship_url ? <span className="text-emerald-600 font-bold">Yes</span> : <span className="text-slate-400">No</span>}
                                        </td>
                                        <td className="p-3">
                                            <button onClick={() => toggleVerified(c.id)} className="hover:underline">
                                                {c.is_verified ? '✅ Yes' : '❌ No'}
                                            </button>
                                        </td>
                                        <td className="p-3">
                                            <button onClick={() => toggleFeatured(c.id)} className="hover:underline">
                                                {c.is_featured ? '⭐ Featured' : '☆ Standard'}
                                            </button>
                                        </td>
                                        <td className="p-3 text-right space-x-2">
                                            <button 
                                                onClick={() => { setEditingCompany(c); setIsAdding(false); }}
                                                className="text-brand-600 font-semibold hover:underline"
                                            >
                                                Edit
                                            </button>
                                            <button 
                                                onClick={() => handleDelete(c.id, c.name)}
                                                className="text-red-600 font-semibold hover:underline"
                                            >
                                                Delete
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                                    {editingCompany ? `Edit ${editingCompany.name}` : 'Add New Company'}
                                </h3>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-500 mb-1">Company Name</label>
                                        <input required name="name" defaultValue={editingCompany?.name || ''} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-500 mb-1">Category</label>
                                            <input required name="category" defaultValue={editingCompany?.category || 'Technology'} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1">Industry</label>
                                            <input required name="industry" defaultValue={editingCompany?.industry || 'Software'} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-500 mb-1">Company Type</label>
                                            <select name="company_type" defaultValue={editingCompany?.company_type || 'MNC'} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none">
                                                <option value="MNC">MNC</option>
                                                <option value="GLC">GLC</option>
                                                <option value="Local Company">Local Company</option>
                                                <option value="Fintech">Fintech</option>
                                                <option value="Government">Government</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1">Hub Location</label>
                                            <input required name="location" defaultValue={editingCompany?.location || 'Kuala Lumpur'} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-slate-500 mb-1">Career URL (https://)</label>
                                        <input required type="url" name="career_url" defaultValue={editingCompany?.career_url || ''} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none" />

                                    </div>

                                    <div>
                                        <label className="block text-slate-500 mb-1">Graduate Program URL (Optional)</label>
                                        <input type="url" name="graduate_url" defaultValue={editingCompany?.graduate_url || ''} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none" />
                                    </div>

                                    <div>
                                        <label className="block text-slate-500 mb-1">Description</label>
                                        <textarea required name="description" rows="3" defaultValue={editingCompany?.description || ''} className="w-full p-2 border border-slate-200 dark:border-slate-800 dark:bg-slate-800 rounded-lg outline-none"></textarea>
                                    </div>

                                    <div className="flex items-center gap-4 pt-2">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" name="is_verified" defaultChecked={editingCompany?.is_verified ?? true} />
                                            <span>Mark Verified</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" name="is_featured" defaultChecked={editingCompany?.is_featured ?? false} />
                                            <span>Mark Featured</span>
                                        </label>
                                    </div>
                                </div>

                                <div className="flex items-center justify-end gap-2 pt-4 border-t border-slate-200 dark:border-slate-800">
                                    <button type="button" onClick={() => { setIsAdding(false); setEditingCompany(null); }} className="px-4 py-2 text-xs font-semibold text-slate-500">Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-brand-600 text-white text-xs font-semibold rounded-xl">Save Changes</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function EmptyState({ onReset }) {
            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-12 text-center space-y-4">
                    <div className="text-4xl">🔍</div>
                    <h3 className="font-bold text-lg text-slate-900 dark:text-white">No companies match your filters</h3>
                    <p className="text-xs text-slate-500 max-w-sm mx-auto">
                        Try resetting your industry, program, or search filters to view available career portals.
                    </p>
                    <button onClick={onReset} className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold hover:bg-brand-700 transition">
                        Reset All Filters
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
